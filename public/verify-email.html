<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email - Marks Tracking System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    .icon.success { color: #28a745; }
    .icon.error { color: #dc3545; }
    .icon.loading { color: #007bff; animation: spin 1s linear infinite; }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    h1 {
      color: #333;
      margin-bottom: 15px;
      font-size: 24px;
    }
    p {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 12px 30px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0056b3;
    }
    #status {
      display: none;
    }
    #status.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading">
      <div class="icon loading">⟳</div>
      <h1>Verifying Email</h1>
      <p>Please wait while we verify your email address...</p>
    </div>
    
    <div id="success" style="display: none;">
      <div class="icon success">✓</div>
      <h1>Email Verified!</h1>
      <p>Your email has been successfully verified. You can now access all features of the Marks Tracking System.</p>
      <a href="/" class="btn">Go to Login</a>
    </div>
    
    <div id="error" style="display: none;">
      <div class="icon error">✗</div>
      <h1>Verification Failed</h1>
      <p id="error-message">The verification link is invalid or has expired.</p>
      <a href="/" class="btn">Go to Login</a>
    </div>
  </div>

  <script>
    async function verifyEmail() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const email = urlParams.get('email');

      if (!token || !email) {
        showError('Invalid verification link. Please check your email and try again.');
        return;
      }

      try {
        const response = await fetch('/api/auth/verify-email', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ token, email })
        });

        const data = await response.json();

        if (response.ok) {
          showSuccess();
        } else {
          showError(data.message || 'Verification failed. Please try again.');
        }
      } catch (error) {
        showError('Network error. Please check your connection and try again.');
      }
    }

    function showSuccess() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('success').style.display = 'block';
    }

    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error-message').textContent = message;
    }

    verifyEmail();
  </script>
</body>
</html>
