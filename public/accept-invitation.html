<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accept Invitation - Marks Tracking System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 450px;
      width: 100%;
    }
    h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
    .subtitle { color: #666; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
    }
    input:focus { outline: none; border-color: #667eea; }
    .btn {
      width: 100%;
      padding: 14px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #218838; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .info-box {
      background: #e7f3ff;
      border: 1px solid #b3d7ff;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .info-box strong { color: #0056b3; }
    .error { color: #dc3545; margin-top: 10px; text-align: center; }
    .success { color: #28a745; margin-top: 10px; text-align: center; }
    #loading, #error-state, #form-state, #success-state { display: none; }
    #loading.show, #error-state.show, #form-state.show, #success-state.show { display: block; }
    .loading-text { text-align: center; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading" class="show">
      <p class="loading-text">Verifying invitation...</p>
    </div>

    <div id="error-state">
      <h1>Invalid Invitation</h1>
      <p id="error-message" class="error"></p>
      <br>
      <a href="/" class="btn" style="display: block; text-align: center; text-decoration: none;">Go to Login</a>
    </div>

    <div id="form-state">
      <h1>Welcome!</h1>
      <p class="subtitle">Complete your registration to join as <strong id="role-text"></strong></p>
      
      <div class="info-box">
        <strong>Email:</strong> <span id="email-display"></span>
      </div>

      <form id="accept-form">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="firstName" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="lastName" required>
        </div>
        <div class="form-group">
          <label>Password (min 8 characters)</label>
          <input type="password" id="password" minlength="8" required>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" required>
        </div>
        <button type="submit" class="btn" id="submit-btn">Create Account</button>
        <p id="form-error" class="error"></p>
      </form>
    </div>

    <div id="success-state">
      <h1>Account Created!</h1>
      <p class="success">Your account has been created successfully.</p>
      <br>
      <a href="/" class="btn" style="display: block; text-align: center; text-decoration: none;">Go to Login</a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    async function verifyInvitation() {
      if (!token) {
        showError('No invitation token provided');
        return;
      }

      try {
        const response = await fetch(`/api/invitations/verify/${token}`);
        const data = await response.json();

        if (!response.ok) {
          showError(data.message || 'Invalid invitation');
          return;
        }

        document.getElementById('email-display').textContent = data.email;
        document.getElementById('role-text').textContent = data.role.charAt(0).toUpperCase() + data.role.slice(1);
        showForm();
      } catch (error) {
        showError('Network error. Please try again.');
      }
    }

    function showError(message) {
      document.getElementById('loading').classList.remove('show');
      document.getElementById('error-state').classList.add('show');
      document.getElementById('error-message').textContent = message;
    }

    function showForm() {
      document.getElementById('loading').classList.remove('show');
      document.getElementById('form-state').classList.add('show');
    }

    function showSuccess() {
      document.getElementById('form-state').classList.remove('show');
      document.getElementById('success-state').classList.add('show');
    }

    document.getElementById('accept-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorEl = document.getElementById('form-error');
      const submitBtn = document.getElementById('submit-btn');

      errorEl.textContent = '';

      if (password !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      try {
        const response = await fetch('/api/invitations/accept', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, firstName, lastName, password })
        });

        const data = await response.json();

        if (!response.ok) {
          errorEl.textContent = data.message || 'Error creating account';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          return;
        }

        // Store token and redirect
        localStorage.setItem('token', data.token);
        showSuccess();
        
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      } catch (error) {
        errorEl.textContent = 'Network error. Please try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });

    verifyInvitation();
  </script>
</body>
</html>
